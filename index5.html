<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSVP + автопауза по вниманию</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 16px;
      line-height: 1.35;
    }

    h1 {
      font-size: 22px;
    }

    #word {
      min-height: 96px;
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 800;
      border: 1px solid #8884;
      border-radius: 12px;
      margin: 16px 0;
      text-align: center;
      padding: 12px;
    }

    #word.paused {
      opacity: 0.35;
    }

    .controls {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }

    button {
      padding: 10px 12px;
      font-size: 16px;
    }

    label {
      display: grid;
      gap: 6px;
      margin: 12px 0;
    }

    input[type="range"] {
      width: 100%;
    }

    .privacy,
    .hint {
      color: #666;
      font-size: 14px;
    }

    /* Видео специально почти невидимо, но не display:none,
       чтобы браузер стабильнее продолжал обрабатывать поток. */
    .sr-video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
      left: 0;
      top: 0;
    }
  </style>
</head>

<body>
  <main>
    <h1>RSVP + автопауза по вниманию</h1>

    <p id="status">Модуль не запущен.</p>

    <p class="privacy">
      Камера используется только локально для автопаузы.
      Кадры не сохраняются и не отправляются на сервер.
    </p>

    <section id="word" aria-live="polite">—</section>

    <div class="controls">
      <button id="btnEnable">Включить камеру и калибровку</button>
      <button id="btnCalibrate" disabled>Перекалибровать</button>
      <button id="btnStart">Старт чтения</button>
      <button id="btnStop" disabled>Стоп</button>
    </div>

    <label>
      Скорость, слов в минуту: <span id="wpmValue">250</span>
      <input id="wpm" type="range" min="120" max="500" value="250" />
    </label>

    <p class="hint">
      Для камеры нужен HTTPS или localhost.
      Для продакшена лучше хостить MediaPipe и модель локально, а не грузить с CDN.
    </p>

    <video id="camera" class="sr-video" playsinline muted></video>
  </main>

  <script type="module">
    const VISION_URL =
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
    const WASM_URL =
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm";
    const MODEL_URL =
      "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";

    const PROFILE_KEY = "rsvp-attention-profile-v1";

    const $ = (id) => document.getElementById(id);

    const statusEl = $("status");
    const wordEl = $("word");
    const videoEl = $("camera");

    const btnEnable = $("btnEnable");
    const btnCalibrate = $("btnCalibrate");
    const btnStart = $("btnStart");
    const btnStop = $("btnStop");

    const wpmEl = $("wpm");
    const wpmValue = $("wpmValue");

    function setStatus(text) {
      statusEl.textContent = text;
    }

    /**
     * Минимальный модуль внимания.
     *
     * Он не пытается определить точную точку взгляда.
     * Он оценивает:
     * - есть ли лицо;
     * - стабильно ли оно;
     * - похоже ли, что пользователь все еще смотрит на экран.
     */
    class AttentionTracker extends EventTarget {
      constructor(video) {
        super();

        this.video = video;

        this.state = "idle";
        this.running = false;

        this.detector = null;
        this.stream = null;

        this.profile = this.loadProfile();

        this._timer = null;
        this._busy = false;

        this._goodSince = null;
        this._badSince = null;

        this._calibration = null;
        this._initPromise = null;

        this._onVisibility = () => {
          if (document.hidden) {
            this.stop();
          }
        };
      }

      isEnabled() {
        return this.running;
      }

      getState() {
        return this.state;
      }

      loadProfile() {
        try {
          const raw = localStorage.getItem(PROFILE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }

      saveProfile(profile) {
        try {
          localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
        } catch {
          // localStorage может быть недоступен, например в приватном режиме.
        }
      }

      async init() {
        if (this.detector) return;

        if (!this._initPromise) {
          this._initPromise = (async () => {
            const visionModule = await import(VISION_URL);
            const { FaceDetector, FilesetResolver } =
              visionModule.default ?? visionModule;

            const fileset = await FilesetResolver.forVisionTasks(WASM_URL);

            this.detector = await FaceDetector.createFromOptions(fileset, {
              baseOptions: {
                modelAssetPath: MODEL_URL
              },
              runningMode: "VIDEO",
              minDetectionConfidence: 0.5
            });
          })().catch((error) => {
            this._initPromise = null;
            throw error;
          });
        }

        return this._initPromise;
      }

      async start() {
        if (this.running) return;

        await this.init();

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("getUserMedia недоступен в этом браузере.");
        }

        this.stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 320 },
            height: { ideal: 240 },
            frameRate: { ideal: 10, max: 15 }
          }
        });

        this.video.srcObject = this.stream;

        await this.video.play();

        await new Promise((resolve) => {
          if (this.video.readyState >= 2) {
            resolve();
          } else {
            this.video.addEventListener("loadeddata", resolve, { once: true });
          }
        });

        this.running = true;
        this.setState("starting");

        this._timer = setInterval(() => this.tick(), 130);

        document.addEventListener("visibilitychange", this._onVisibility);

        this.dispatchEvent(new Event("trackingStarted"));
      }

      stop() {
        const calibration = this._calibration;
        this._calibration = null;

        if (calibration?.reject) {
          calibration.reject(new Error("Отслеживание остановлено."));
        }

        if (this._timer) {
          clearInterval(this._timer);
        }

        this._timer = null;
        this.running = false;

        this._goodSince = null;
        this._badSince = null;

        this.stream?.getTracks().forEach((track) => track.stop());
        this.stream = null;

        this.video.pause();
        this.video.srcObject = null;

        document.removeEventListener("visibilitychange", this._onVisibility);

        if (this.state !== "idle") {
          this.setState("idle");
        }

        this.dispatchEvent(new Event("trackingStopped"));
      }

      async calibrate(durationMs = 3000) {
        if (!this.running) {
          await this.start();
        }

        if (this._calibration) {
          throw new Error("Калибровка уже выполняется.");
        }

        this._calibration = {
          startedAt: performance.now(),
          durationMs,
          samples: [],
          resolve: null,
          reject: null
        };

        return new Promise((resolve, reject) => {
          this._calibration.resolve = resolve;
          this._calibration.reject = reject;
        });
      }

      setState(next) {
        const prev = this.state;

        if (prev === next) return;

        this.state = next;

        if (prev !== "looking" && next === "looking") {
          this.dispatchEvent(new Event("attentionStart"));
        }

        if (prev === "looking" && next !== "looking") {
          this.dispatchEvent(new Event("attentionLost"));
        }

        this.dispatchEvent(
          new CustomEvent("stateChange", {
            detail: { prev, next }
          })
        );
      }

      async tick() {
        if (!this.running || this._busy) return;

        this._busy = true;

        try {
          const sample = await this.detect();
          const now = performance.now();

          if (this._calibration) {
            this.handleCalibration(sample, now);
          }

          const likelyLooking = this.isLooking(sample);

          if (likelyLooking) {
            this._badSince = null;

            if (!this._goodSince) {
              this._goodSince = now;
            }

            if (this.state !== "looking" && now - this._goodSince >= 600) {
              this.setState("looking");
            }
          } else {
            this._goodSince = null;

            if (!this._badSince) {
              this._badSince = now;
            }

            const badFor = now - this._badSince;

            if (badFor >= 900) {
              this.setState(sample?.faceDetected ? "not_looking" : "lost_face");
            }
          }
        } catch (error) {
          console.error(error);
        } finally {
          this._busy = false;
        }
      }

      async detect() {
        if (!this.detector || this.video.readyState < 2 || !this.video.videoWidth) {
          return { faceDetected: false };
        }

        const result = this.detector.detectForVideo(
          this.video,
          performance.now()
        );

        const detections = result.detections ?? [];

        if (!detections.length) {
          return { faceDetected: false };
        }

        // Берем самое большое лицо в кадре.
        // Обычно это ближайший человек.
        let best = null;
        let bestArea = -1;

        for (const detection of detections) {
          const box = detection.boundingBox;
          if (!box) continue;

          const area = box.width * box.height;

          if (area > bestArea) {
            best = detection;
            bestArea = area;
          }
        }

        if (!best?.boundingBox) {
          return { faceDetected: false };
        }

        const box = best.boundingBox;
        const vw = this.video.videoWidth;
        const vh = this.video.videoHeight;

        const area = (box.width * box.height) / (vw * vh);
        const centerX = (box.originX + box.width / 2) / vw;
        const centerY = (box.originY + box.height / 2) / vh;

        const score = best.categories?.[0]?.score ?? 0.5;

        if (
          !Number.isFinite(area) ||
          !Number.isFinite(centerX) ||
          !Number.isFinite(centerY)
        ) {
          return { faceDetected: false };
        }

        return {
          faceDetected: true,
          area,
          centerX,
          centerY,
          score
        };
      }

      isLooking(sample) {
        if (!sample?.faceDetected) return false;
        if ((sample.score ?? 0) < 0.5) return false;

        // Если калибровки нет, считаем достаточным факт, что лицо в кадре.
        // Это компромисс для минимальной версии.
        if (!this.profile) return true;

        const p = this.profile;

        const areaOk =
          sample.area >= p.minArea &&
          sample.area <= p.maxArea;

        const move = Math.hypot(
          sample.centerX - p.centerX,
          sample.centerY - p.centerY
        );

        return areaOk && move <= p.maxMove;
      }

      handleCalibration(sample, now) {
        const calibration = this._calibration;

        if (!calibration) return;

        if (sample?.faceDetected) {
          calibration.samples.push(sample);
        }

        if (now - calibration.startedAt < calibration.durationMs) {
          return;
        }

        this._calibration = null;

        if (calibration.samples.length < 8) {
          calibration.reject(
            new Error("Не удалось собрать калибровку. Посмотрите на экран и повторите.")
          );
          return;
        }

        const avg = calibration.samples.reduce(
          (acc, item) => {
            acc.area += item.area;
            acc.centerX += item.centerX;
            acc.centerY += item.centerY;
            return acc;
          },
          {
            area: 0,
            centerX: 0,
            centerY: 0
          }
        );

        const n = calibration.samples.length;

        const area = avg.area / n;
        const centerX = avg.centerX / n;
        const centerY = avg.centerY / n;

        const profile = {
          version: 1,
          createdAt: new Date().toISOString(),
          centerX,
          centerY,
          area,
          minArea: area * 0.62,
          maxArea: area * 1.85,
          maxMove: 0.24
        };

        this.profile = profile;
        this.saveProfile(profile);

        this.dispatchEvent(new Event("calibrationDone"));

        calibration.resolve(profile);
      }
    }

    const tracker = new AttentionTracker(videoEl);

    const words =
      "Это минимальный тест RSVP читалки с автопаузой когда пользователь не смотрит на экран телефона Калибровка хранится локально и видео не отправляется на сервер".split(
        /\s+/
      );

    let wordIndex = 0;
    let reading = false;
    let timer = null;

    function intervalMs() {
      const wpm = Number(wpmEl.value) || 250;
      return Math.max(40, Math.round(60000 / wpm));
    }

    function canAdvance() {
      return !tracker.isEnabled() || tracker.getState() === "looking";
    }

    function showNextWord() {
      wordEl.textContent = words[wordIndex % words.length];
      wordIndex += 1;
    }

    function schedule() {
      if (!reading) return;

      if (!canAdvance()) {
        wordEl.classList.add("paused");
        setStatus("Пауза: модуль не уверен, что вы смотрите на экран.");
        timer = setTimeout(schedule, 180);
        return;
      }

      wordEl.classList.remove("paused");
      showNextWord();

      setStatus(
        tracker.isEnabled()
          ? "Чтение активно, слежение включено."
          : "Чтение активно, слежение выключено."
      );

      timer = setTimeout(schedule, intervalMs());
    }

    function restartScheduler(delayMs = 0) {
      if (!reading) return;

      clearTimeout(timer);
      timer = setTimeout(schedule, delayMs);
    }

    function startReading() {
      if (reading) return;

      reading = true;
      wordIndex = 0;

      btnStart.disabled = true;
      btnStop.disabled = false;

      restartScheduler(0);
    }

    function stopReading() {
      reading = false;

      clearTimeout(timer);

      wordEl.textContent = "—";
      wordEl.classList.remove("paused");

      btnStart.disabled = false;
      btnStop.disabled = true;

      setStatus("Чтение остановлено.");
    }

    tracker.addEventListener("attentionLost", () => {
      if (reading) {
        restartScheduler(0);
      }
    });

    tracker.addEventListener("attentionStart", () => {
      if (reading) {
        // Небольшая задержка перед возобновлением,
        // чтобы не дергать текст слишком резко.
        restartScheduler(450);
      }
    });

    tracker.addEventListener("stateChange", (event) => {
      const state = event.detail.next;

      const text = {
        idle: "Модуль не запущен.",
        starting: "Инициализация слежения...",
        looking: "Внимание: пользователь смотрит на экран.",
        not_looking: "Внимание потеряно: пользователь, вероятно, не смотрит.",
        lost_face: "Лицо не найдено."
      }[state];

      if (text && !reading) {
        setStatus(text);
      }
    });

    tracker.addEventListener("calibrationDone", () => {
      setStatus("Калибровка сохранена локально.");
      btnCalibrate.disabled = false;
    });

    tracker.addEventListener("trackingStopped", () => {
      btnEnable.disabled = false;
      btnCalibrate.disabled = true;

      if (!reading) {
        setStatus("Отслеживание остановлено.");
      }
    });

    btnEnable.addEventListener("click", async () => {
      try {
        btnEnable.disabled = true;

        setStatus("Запуск камеры...");
        await tracker.start();

        setStatus("Калибровка: смотрите на экран 3 секунды.");
        await tracker.calibrate(3000);
      } catch (error) {
        console.error(error);
        setStatus(`Ошибка: ${error?.message ?? error}`);
        btnEnable.disabled = false;
      }
    });

    btnCalibrate.addEventListener("click", async () => {
      try {
        btnCalibrate.disabled = true;

        setStatus("Калибровка: смотрите на экран 3 секунды.");
        await tracker.calibrate(3000);
      } catch (error) {
        console.error(error);
        setStatus(`Ошибка калибровки: ${error?.message ?? error}`);
      } finally {
        btnCalibrate.disabled = false;
      }
    });

    btnStart.addEventListener("click", startReading);
    btnStop.addEventListener("click", stopReading);

    wpmEl.addEventListener("input", () => {
      wpmValue.textContent = wpmEl.value;

      if (reading) {
        restartScheduler(0);
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && reading) {
        stopReading();
      }
    });

    if (!window.isSecureContext) {
      setStatus("Нужен HTTPS или localhost: браузер не даст доступ к камере.");
      btnEnable.disabled = true;
    }
  </script>
</body>
</html>
