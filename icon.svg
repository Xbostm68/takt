<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Фон -->
  <rect width="512" height="512" rx="96" fill="#101111"/>
  
  <!-- Вертикальная линия фокуса -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#e75248" stroke-opacity="0.3" stroke-width="4"/>
  
  <!-- Верхняя и нижняя чёрточки -->
  <line x1="220" y1="40" x2="292" y2="40" stroke="#e75248" stroke-opacity="0.6" stroke-width="6"/>
  <line x1="220" y1="472" x2="292" y2="472" stroke="#e75248" stroke-opacity="0.6" stroke-width="6"/>
  
  <!-- Текст "Takt" с красной "a" по центру -->
  <text x="256" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="160" font-weight="600" text-anchor="middle" dominant-baseline="central" letter-spacing="-3">
    <tspan fill="#f1f0eb">T</tspan><tspan fill="#e75248">a</tspan><tspan fill="#f1f0eb">kt</tspan>
  </text>
</svg>