<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Фон -->
  <rect width="512" height="512" fill="#101111"/>
  
  <!-- Вся графика уменьшена в центр (scale 0.65), чтобы не обрезалась -->
  <g transform="translate(256, 256) scale(0.65) translate(-256, -256)">
    <line x1="256" y1="40" x2="256" y2="472" stroke="#e75248" stroke-opacity="0.3" stroke-width="6"/>
    <line x1="210" y1="40" x2="302" y2="40" stroke="#e75248" stroke-opacity="0.6" stroke-width="8"/>
    <line x1="210" y1="472" x2="302" y2="472" stroke="#e75248" stroke-opacity="0.6" stroke-width="8"/>
    <text x="256" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="160" font-weight="600" text-anchor="middle" dominant-baseline="central" letter-spacing="-3">
      <tspan fill="#f1f0eb">T</tspan><tspan fill="#e75248">a</tspan><tspan fill="#f1f0eb">kt</tspan>
    </text>
  </g>
</svg>